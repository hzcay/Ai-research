services:
  api:
    profiles: ["app"]
    container_name: research-assistant-rag-api
    image: research-assistant-rag:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_research
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password
    depends_on:
      - qdrant
      - postgres
      - redis
      - minio
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  worker:
    profiles: ["app"]
    container_name: research-assistant-rag-worker
    image: research-assistant-rag-worker:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - ../.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_research
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password
    depends_on:
      - qdrant
      - postgres
      - redis
      - minio
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  ui:
    profiles: ["app"]
    container_name: research-assistant-rag-ui
    image: research-assistant-rag-ui:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ui
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "56333:6333"
      - "56334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_research
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "56379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "59000:9000"
      - "59001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
  minio_data:
  hf_cache:
